#App  DEV - techlab
# arquivo config de exemplo.
# função de proxy reverso direcionando para um IP
# Usando 1 unico hosts em um bloco  do servidor.

#Aqui usamos uma unica url. Usamos a entrada x.bradesco.com na porta 80
#Ou pode ser bradesco.com wwww.bradesco.com caso queira direcionar para raiz do site

server {
        listen 80;
        listen [::]:80;

        #URL do seu servidor registrada no seu DNS
        #Para o host responder na rais do dominio remova o dev e o ponto e adicione o wwww.techlab.com
        server_name dev.techlab.com;

        #Caminho do seu arquivo index ou node.js da sua aplicação
        root /var/www/html;

        location /  {
        index index.html index.htm index.php;
        root /var/www/html;
        try_files $uri $uri/ /index.html;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;

        }

        access_log /var/log/nginx/www.techlab.com.access.log;
        error_log /var/log/nginx/www.www.techlab.com.error.log;
}
