# Exemplo de bloco padrão. aqui usamos os domonio bradesco.com que responde na porta 81.
# Para cada bloco/dominio configurado, deve ser atribuida uma porta unica.

# Cada dominio deve apornta para um unico root. Exempplo bradesco.com (Linha 13) aponta para root /var/www/bradesco.com/html (linha 18)
# Caso aplicação seja .pho ou .node.js é necessário declarar a extenção dos arquivos .php ou .node.js na linha 18.
# Dentro de cada bloco você pode ter varios hosts virtuais, exemplo: dev.bradesco.com apontando para root /var/www/dev-bradesco.com/html
# Para cada host virtual é necessário um apontamento de root (Arquivos da aplicação)

# Veja como configurar blocos de servidor [AQUI](https://www.digitalocean.com/community/tutorials/how-to-install-nginx-on-rocky-linux-9) <br>
# Veja exemplos d ehost virtuais [AQUI]() <br>

server {
        listen 81;
        listen [::]:81;

        #O nome server não vai funcionar se não estiver apontando para um IP com uma entrada de DNS.
        #deixei aqui apenas como exemplo.
        server_name bradesco.com  www.bradesco.com;
        root /var/www/bradesco.com/html;

        location / {
            index index.html index.htm index.php index.nginx-debian.html ;
            root /var/www/bradesco.com/html;

            try_files $uri $uri/ /index.html;
            proxy_http_version 1.1;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
        }
}

